name: Deploy

# Build the static site and rsync it to the nginx server.
# Triggered automatically after a successful "Fetch Prompts" run (data
# changed → rebuild → redeploy), and also runnable on demand.
on:
  workflow_run:
    workflows: ['Fetch Prompts']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only run when the upstream Fetch Prompts workflow actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Prepare the SSH key from secrets so rsync can connect non-interactively.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Trust the host to avoid the yes/no prompt on first connect.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PATH_: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${PORT:-22}"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT" \
            dist/ \
            "$USER@$HOST:$PATH_/"

      - name: Summary
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PATH_: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "### Deploy result" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Built and synced to \`$HOST$PATH_\`" >> "$GITHUB_STEP_SUMMARY"
