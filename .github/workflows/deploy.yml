name: Deploy

# Build the static site and rsync it to the nginx server.
# Triggered automatically after a successful "Fetch Prompts" run (data
# changed → rebuild → redeploy), and also runnable on demand.
on:
  # 1. push 到 main → 立即构建并部署（代码改动实时上线）
  push:
    branches: [main]
  # 2. Fetch Prompts 成功后自动部署（数据更新触发）
  workflow_run:
    workflows: ['Fetch Prompts']
    types: [completed]
  # 3. 手动触发
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only run when the upstream Fetch Prompts workflow actually succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Prepare the SSH key from secrets so rsync can connect non-interactively.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Trust the host to avoid the yes/no prompt on first connect.
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEST_PATH: ${{ secrets.DEPLOY_PATH }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          PORT="${PORT:-22}"
          DEST_PATH="${DEST_PATH%/}"
          echo "Deploying to $DEPLOY_USER@$HOST:$PORT$DEST_PATH"
          # --exclude preserves BaoTa/panel protection files:
          #   .user.ini   PHP open_basedir guard (locked with chattr +i)
          #   .well-known Let's Encrypt / ACME challenge dir
          #   .htaccess   panel-managed rewrite rules
          rsync -avz --delete \
            --exclude='.user.ini' \
            --exclude='.well-known' \
            --exclude='.htaccess' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $PORT" \
            dist/ \
            "$DEPLOY_USER@$HOST:$DEST_PATH/"

      - name: Summary
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEST_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "### Deploy result" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Built and synced to \`$HOST$DEST_PATH\`" >> "$GITHUB_STEP_SUMMARY"
